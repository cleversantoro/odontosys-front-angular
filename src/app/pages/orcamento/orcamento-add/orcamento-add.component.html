<div>
  <app-page-breadcrumb pageTitle="Novo Orçamento" />

  <div class="rounded-2xl border border-gray-200 bg-white px-5 py-7 xl:px-10 xl:py-10">
    <h2 class="text-lg font-bold text-gray-800 mb-6">Novo Orçamento</h2>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 mb-6">

      <!-- Paciente -->
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Paciente *</label>
        <select [(ngModel)]="pacienteId"
          class="h-11 w-full rounded-xl border border-gray-300 px-3 text-sm">
          <option [value]="0">-- Selecione --</option>
          <option *ngFor="let p of pacientes()" [value]="p.id">{{ p.nome }}</option>
        </select>
      </div>

      <!-- Profissional -->
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Profissional *</label>
        <select [(ngModel)]="profissionalId"
          class="h-11 w-full rounded-xl border border-gray-300 px-3 text-sm">
          <option [value]="0">-- Selecione --</option>
          <option *ngFor="let p of profissionais()" [value]="p.id">{{ p.nome }}</option>
        </select>
      </div>

      <!-- Convênio -->
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Convênio</label>
        <select [(ngModel)]="convenioId"
          class="h-11 w-full rounded-xl border border-gray-300 px-3 text-sm">
          <option [value]="null">-- Nenhum --</option>
          <option *ngFor="let c of convenios()" [value]="c.id">{{ c.nome }}</option>
        </select>
      </div>

      <!-- Validade -->
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Validade</label>
        <input type="date" [(ngModel)]="validade"
          class="h-11 w-full rounded-xl border border-gray-300 px-3 text-sm" />
      </div>

    </div>

    <!-- Itens -->
    <h3 class="text-base font-semibold text-gray-700 mb-3">Itens do Orçamento</h3>
    <div class="overflow-auto rounded-xl border mb-4">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-50">
          <tr class="text-left">
            <th class="px-3 py-2">Procedimento / Descrição</th>
            <th class="px-3 py-2 w-24">Dente</th>
            <th class="px-3 py-2 w-24">Qtd.</th>
            <th class="px-3 py-2 w-32">Valor Unit. (R$)</th>
            <th class="px-3 py-2 w-32">Total (R$)</th>
            <th class="px-3 py-2 w-12"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of itens; let i = index" class="border-t">
            <td class="px-3 py-2">
              <input type="text" [(ngModel)]="item.descricao" placeholder="Descrição"
                class="h-9 w-full rounded-lg border border-gray-300 px-2 text-sm" />
            </td>
            <td class="px-3 py-2">
              <input type="text" [(ngModel)]="item.dente" placeholder="Ex: 18"
                class="h-9 w-full rounded-lg border border-gray-300 px-2 text-sm" />
            </td>
            <td class="px-3 py-2">
              <input type="number" [(ngModel)]="item.quantidade" min="1"
                (ngModelChange)="calcItem(item)"
                class="h-9 w-full rounded-lg border border-gray-300 px-2 text-sm" />
            </td>
            <td class="px-3 py-2">
              <input type="number" [(ngModel)]="item.valorUnitario" min="0" step="0.01"
                (ngModelChange)="calcItem(item)"
                class="h-9 w-full rounded-lg border border-gray-300 px-2 text-sm" />
            </td>
            <td class="px-3 py-2 font-semibold">
              R$ {{ (item.quantidade * item.valorUnitario | number:'1.2-2') }}
            </td>
            <td class="px-3 py-2">
              <button class="text-red-500 hover:text-red-700 text-lg leading-none"
                (click)="removeItem(i)">&times;</button>
            </td>
          </tr>
        </tbody>
        <tfoot>
          <tr class="border-t bg-slate-50">
            <td colspan="4" class="px-3 py-2 text-right font-semibold">Total do Orçamento:</td>
            <td class="px-3 py-2 font-bold text-blue-700">R$ {{ (valorTotal() | number:'1.2-2') }}</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <button type="button"
      class="mb-6 px-4 py-2 rounded-xl border border-dashed border-blue-400 text-blue-600 text-sm hover:bg-blue-50"
      (click)="addItem()">+ Adicionar Item</button>

    <!-- Observações -->
    <div class="mb-6">
      <label class="mb-1 block text-sm font-medium text-gray-700">Observações</label>
      <textarea [(ngModel)]="observacoes" rows="3" placeholder="Observações adicionais…"
        class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm"></textarea>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3">
      <button class="rounded-xl border border-gray-300 px-5 py-2 text-sm" (click)="cancelar()">Cancelar</button>
      <button class="rounded-xl bg-blue-600 px-5 py-2 text-sm text-white hover:bg-blue-700 disabled:opacity-50"
        [disabled]="saving() || !isValid()" (click)="salvar()">
        {{ saving() ? 'Salvando…' : 'Salvar Orçamento' }}
      </button>
    </div>
  </div>
</div>
