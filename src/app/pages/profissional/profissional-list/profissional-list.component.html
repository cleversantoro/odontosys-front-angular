<div>
  <app-page-breadcrumb pageTitle="Consulta de Profissionais" />

  <div class="rounded-2xl border border-gray-200 bg-white px-5 py-7 xl:px-10 xl:py-10">
    <div class="flex flex-col gap-4">

      <!-- Header -->
      <div class="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
        <h2 class="text-xl font-extrabold">Profissionais</h2>
        <div class="flex flex-wrap gap-2">
          <input type="text" placeholder="Buscar por nome, e-mail, CRO..."
                 class="w-72 border rounded-xl px-3 py-2"
                 [value]="search()" (input)="search.set($any($event.target).value)" />
          <a routerLink="/profissional/novo"
             class="px-3 py-2 rounded-xl font-semibold bg-emerald-600 text-white hover:bg-emerald-700">
            + Novo Profissional
          </a>
        </div>
      </div>

      <!-- Tabela -->
      <div class="overflow-auto rounded-xl border">
        <table class="min-w-full table-auto text-sm">
          <thead class="bg-slate-50">
            <tr class="text-left">
              <th class="px-3 py-2">ID</th>
              <th class="px-3 py-2">Nome</th>
              <th class="px-3 py-2">E-mail</th>
              <th class="px-3 py-2">CRO</th>
              <th class="px-3 py-2">Status</th>
              <th class="px-3 py-2 text-right">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="loading()">
              <td class="px-3 py-4 text-center text-gray-500" colspan="6">Carregando…</td>
            </tr>
            <tr *ngIf="!loading() && error()">
              <td class="px-3 py-4 text-center text-red-600" colspan="6">{{ error() }}</td>
            </tr>
            <tr *ngIf="!loading() && !error() && filtered().length === 0">
              <td class="px-3 py-4 text-center text-gray-500" colspan="6">Nenhum profissional encontrado.</td>
            </tr>
            <tr *ngFor="let p of filtered()" class="border-t hover:bg-gray-50">
              <td class="px-3 py-2">{{ p.id }}</td>
              <td class="px-3 py-2 font-semibold">{{ p.nome }}</td>
              <td class="px-3 py-2">{{ p.email }}</td>
              <td class="px-3 py-2">{{ p.cro }}</td>
              <td class="px-3 py-2">
                <span [class]="p.status === 'ativo'
                  ? 'px-2 py-0.5 rounded-full text-xs bg-emerald-100 text-emerald-700'
                  : 'px-2 py-0.5 rounded-full text-xs bg-gray-100 text-gray-600'">
                  {{ p.status ?? 'ativo' }}
                </span>
              </td>
              <td class="px-3 py-2">
                <div class="flex items-center gap-2 justify-end">
                  <a class="px-2 py-1 rounded-lg border hover:bg-gray-50"
                     [routerLink]="['/profissional/detalhe', p.id]">
                    Detalhe
                  </a>
                  <a class="px-2 py-1 rounded-lg border hover:bg-gray-50"
                     [routerLink]="['/profissional/detalhe', p.id]">
                    Editar
                  </a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
