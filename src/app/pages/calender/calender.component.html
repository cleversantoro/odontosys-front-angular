<div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="custom-calendar">
    <full-calendar #calendar [options]="calendarOptions"></full-calendar>
  </div>

  <app-modal [isOpen]="isOpen" (close)="closeModal()" className="max-w-[700px] p-6 lg:p-10">
    <div class="flex flex-col px-2 overflow-y-auto custom-scrollbar">

      <!-- Header -->
      <div>
        <h5 class="mb-1 font-semibold text-gray-800 text-theme-xl dark:text-white/90 lg:text-2xl">
          {{ selectedAgendamentoId ? 'Editar Agendamento' : 'Novo Agendamento' }}
        </h5>
        <p class="text-sm text-gray-500 dark:text-gray-400">Preencha os dados do agendamento.</p>
      </div>

      <!-- Form grid -->
      <div class="mt-6 grid sm:grid-cols-2 gap-4">

        <!-- Paciente autocomplete -->
        <div class="sm:col-span-2">
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Paciente *</label>
          <input type="text" [(ngModel)]="pacienteSearch" (input)="filterPacientes()"
            placeholder="Filtrar paciente por nome..."
            class="mb-1 h-9 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm shadow-theme-xs
                   focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10
                   dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
          <select [(ngModel)]="form.pacienteId"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm shadow-theme-xs
                   focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10
                   dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
            <option [ngValue]="null">-- Selecione o paciente --</option>
            <option *ngFor="let p of filteredPacientes" [ngValue]="p.id">{{ p.nome }}</option>
          </select>
        </div>

        <!-- Profissional -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Profissional *</label>
          <select [(ngModel)]="form.profissionalId"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm shadow-theme-xs
                   focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10
                   dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
            <option [ngValue]="null">-- Selecione o profissional --</option>
            <option *ngFor="let pr of profissionais" [ngValue]="pr.id">{{ pr.nome }}</option>
          </select>
        </div>

        <!-- Convênio -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Convênio</label>
          <select [(ngModel)]="form.convenioId"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm shadow-theme-xs
                   focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10
                   dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
            <option [ngValue]="null">-- Nenhum --</option>
            <option *ngFor="let c of convenios" [ngValue]="c.id">{{ c.nome }}</option>
          </select>
        </div>

        <!-- Data -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Data *</label>
          <input type="date" [(ngModel)]="form.data"
            class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm shadow-theme-xs
                   focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10
                   dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
        </div>

        <!-- Hora -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Horário *</label>
          <input type="time" [(ngModel)]="form.hora"
            class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm shadow-theme-xs
                   focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10
                   dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
        </div>

        <!-- Status -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Status</label>
          <select [(ngModel)]="form.status"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm shadow-theme-xs
                   focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10
                   dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
            <option *ngFor="let s of statusOptions" [ngValue]="s">{{ s }}</option>
          </select>
        </div>

        <!-- Tipo de Procedimento -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Tipo de Procedimento</label>
          <input type="text" [(ngModel)]="form.tipoProcedimento" placeholder="Ex: Limpeza, Extração..."
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm shadow-theme-xs
                   focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10
                   dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
        </div>

        <!-- Observações -->
        <div class="sm:col-span-2">
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Observações</label>
          <textarea [(ngModel)]="form.obs" rows="3" placeholder="Anotações adicionais..."
            class="w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm shadow-theme-xs
                   focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10
                   dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"></textarea>
        </div>

      </div>

      <!-- Footer buttons -->
      <div class="flex flex-wrap items-center gap-3 mt-6 sm:justify-end">

        <button *ngIf="selectedAgendamentoId" (click)="handleDelete()" type="button" [disabled]="deleting"
          class="flex justify-center rounded-lg border border-red-300 bg-white px-4 py-2.5 text-sm font-medium
                 text-red-600 hover:bg-red-50 disabled:opacity-50 dark:border-red-700 dark:bg-transparent">
          {{ deleting ? 'Excluindo...' : 'Excluir' }}
        </button>

        <button (click)="closeModal()" type="button"
          class="flex justify-center rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium
                 text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400">
          Cancelar
        </button>

        <button (click)="handleSave()" type="button"
          [disabled]="saving || !form.pacienteId || !form.profissionalId || !form.data"
          class="flex justify-center rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium
                 text-white hover:bg-brand-600 disabled:opacity-50">
          {{ saving ? 'Salvando...' : (selectedAgendamentoId ? 'Salvar Alterações' : 'Agendar') }}
        </button>

      </div>
    </div>
  </app-modal>
</div>
